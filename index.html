<style>
  @font-face {

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: #4aa8ff;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    background: #4aa8ff;
    image-rendering: pixelated;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  /* Zero-size probe: env() resolves to the device insets on any element, so this
     one exists only to hand the CSS-px safe areas to PixelControls.layout(). */
  #safe-area {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    visibility: hidden;
    pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);

<body>
<canvas id="game"></canvas>
<div id="safe-area" aria-hidden="true"></div>
<script src="game.js"></script>

<script>
"use strict";
(function () {
  var TILE = PixelLeap.TILE;
  var VIEW_H = PixelLeap.VIEW_TILES_H * TILE; /* 240 internal pixels tall */

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d", { alpha: false });

  var view = { width: 320, height: VIEW_H, S: 1, offX: 0, offY: 0, pxW: 320, pxH: 240, bandPx: 240, portrait: false, dpr: 1 };

  var safeProbe = document.getElementById("safe-area");
  var layout = null;

  /* env() insets as CSS px, read once per resize from a hidden probe element. */
  function safeInsets() {
    var cs = window.getComputedStyle(safeProbe);
    return {
      top: parseFloat(cs.paddingTop) || 0,
      right: parseFloat(cs.paddingRight) || 0,
      bottom: parseFloat(cs.paddingBottom) || 0,
      left: parseFloat(cs.paddingLeft) || 0
    };
  }

  var ctl = PixelControls.createControls(PixelControls.layout(320, 240, safeInsets()));
  var debugLevel = (function () { var raw = new URLSearchParams(location.search).get("level"); var n = raw === null ? 0 : Number(raw); if (!isFinite(n)) n = 0; return Math.max(0, Math.min(PixelLeap.LEVELS.length - 1, Math.floor(n))); })();
  var debugBig = new URLSearchParams(location.search).get("big") === "1";

  const audio = PixelAudio.createAudio({ muted: PixelScreens.loadMuted() });

  function resize() {
    var dpr = Math.min(Math.max(window.devicePixelRatio || 1, 1), 2);
    var cssW = Math.max(1, canvas.clientWidth || window.innerWidth || 320);
    var cssH = Math.max(1, canvas.clientHeight || window.innerHeight || 240);
    view.dpr = dpr;
    var safe = safeInsets();
    layout = PixelControls.layout(cssW, cssH, safe);
    ctl.setLayout(layout);
    view.pxW = Math.max(1, Math.round(cssW * dpr));
    view.pxH = Math.max(1, Math.round(cssH * dpr));
    canvas.width = view.pxW;
    canvas.height = view.pxH;
    PixelBackdrop.clearCache();
    PixelTiles.clearCache();
    panelCache = Object.create(null);
    var sized = PixelView.compute(view.pxW, view.pxH, dpr, safe);
    view.S = sized.S;
    view.width = sized.w;
    view.height = sized.h;
    view.offX = sized.offX;
    view.offY = sized.offY;
    view.bandPx = sized.bandPx;
    view.portrait = sized.portrait;
    if (state) { state.viewWidth = view.width; PixelCamera.reset(renderCamera, state.player, { w: view.width }, state.width * PixelLeap.TILE); }
    ctx.imageSmoothingEnabled = false;
  }

  var state = null;
  var clock = 0;
  var renderCamera = PixelCamera.createCamera();
  var previous = null;
  var hitStop = 0;
  var renderCamX = 0;
  var spriteIds = new WeakMap(), nextSpriteId = 1;
  var propArt=Object.create(null), pitArt=Object.create(null), plannedProps=null, plannedFor=null;
  var panelCache = Object.create(null);

  function theme() {
    return (PixelLeap.LEVELS[state.level] || { theme: "meadow" }).theme;
  }
  function themeColors() {
    var palette = PixelTiles.palettes[theme()] || PixelTiles.palettes.meadow;
    return { dirt: palette.dirt[0], dark: palette.dark, topHi: palette.hi };
  }
  /* ---------- sprite blitting from character maps ---------- */
  var spriteCache = Object.create(null);
  function blit(map, gx, gy, pal, flipX) {
    var mapId=spriteIds.get(map); if(!mapId){mapId=nextSpriteId++;spriteIds.set(map,mapId);}
    var palId=spriteIds.get(pal); if(!palId){palId=nextSpriteId++;spriteIds.set(pal,palId);}
    var key = mapId+":"+palId+(flipX ? ":f" : ":n");
    var cached = spriteCache[key];
    if (!cached) {
      cached = document.createElement("canvas"); cached.width = map[0].length; cached.height = map.length;
      var c = cached.getContext("2d");
      for (var cr=0; cr<map.length; cr++) for (var cc=0; cc<map[cr].length; cc++) {
        var color=pal[map[cr].charAt(flipX ? map[cr].length-1-cc : cc)];
        if (color) { c.fillStyle=color; c.fillRect(cc,cr,1,1); }
      }
      spriteCache[key]=cached;
    }
    ctx.drawImage(cached,gx,gy);
  }
  var pipBakeCache=PixelSprites.createCache(function(w,h){var c=document.createElement("canvas");c.width=w;c.height=h;return c;});
  var pipAnimator=PixelAnim.createPipAnimator(Math.random), pipShadow=null;
  var PAL_ROCK = { R: "#8d97a8", D: "#4a5364", L: "#c2cad8", E: "#1b2130", M: "#2b3342" };
  var PAL_FLY = { Y: "#f5d43c", D: "#3a2f10", W: "#e9f6ff", K: "#1b2130" };
  var PAL_LEAF = { G: "#5fd24a", D: "#21701f", L: "#a5ef7a", K: "#8a5a2b" };

  var frameEvents=[], frameElapsed=0;
  function drawPipSprite(p,pp,cam){
    var big=!!p.big,h=big?28:18,px=PixelCamera.snap(pp.x-cam+((p.w||12)-16)/2,view.S),py=PixelCamera.snap(pp.y+(p.h||14)-h,view.S);
    var pose=pipAnimator.update(p,ctl.input?ctl.input():null,frameElapsed,frameEvents,state.mode,{x:px+cam,y:py});
    if(!pipShadow){pipShadow=document.createElement('canvas');pipShadow.width=32;pipShadow.height=10;var sc=pipShadow.getContext('2d'),g=sc.createRadialGradient(16,5,1,16,5,15);g.addColorStop(0,'rgba(0,0,0,.25)');g.addColorStop(1,'rgba(0,0,0,0)');sc.fillStyle=g;sc.fillRect(0,0,32,10);}
    var floorY=PixelAnim.findFloor(state,p.x+(p.w||12)/2,p.y+(p.h||14)),above=floorY===null?64:Math.max(0,floorY-(p.y+p.h)),shadowAlpha=.25*Math.max(0,1-above/64);
    if(floorY!==null&&shadowAlpha>0){var shadowScale=Math.max(0,1-above/64);ctx.globalAlpha=shadowAlpha/.25;ctx.drawImage(pipShadow,PixelCamera.snap(pp.x-cam-4*shadowScale,view.S),PixelCamera.snap(floorY,view.S),24*shadowScale,7*shadowScale);ctx.globalAlpha=1;}
    ctx.save();ctx.translate(px+8,py+h);ctx.scale((p.facing<0?-1:1)*Math.round(pose.sx*16)/16,Math.round(pose.sy*16)/16);ctx.translate(-8,-h);
    var frameCanvas=pipBakeCache.get(pose.name,pose.frame,big);ctx.drawImage(frameCanvas,0,0);ctx.restore();
    ctx.fillStyle=PixelSprites.PAL.S;
    for(var j=1;j<6;j++){var a=pose.scarf[j-1],b=pose.scarf[j],dx=b.x-a.x,dy=b.y-a.y,n=Math.max(1,Math.ceil(Math.hypot(dx,dy))),thick=j<4?2:1;ctx.fillStyle=j<4?PixelSprites.PAL.S:PixelSprites.PAL.Q;for(var k=0;k<=n;k++){var tx=PixelCamera.snap(a.x+dx*k/n-cam,view.S),ty=PixelCamera.snap(a.y+dy*k/n,view.S);ctx.fillRect(tx,ty,thick,thick);}}
  }
  var LIFE_ICON = ["DDD.DDD", "DWWDWWD", "DWWWWWD", "DWWWWWD", ".DDDDD.", "..DDD..", "...D..."];

  var ROCK = [
    "...DDDDDD...",
    ".DDLLLLLLDD.",
    "DLLLLLLLLLLD",
    "DRLRRRRRRRRD",
    "DRRERRRERRRD",
    "DRMRRRRRRMRD",
    "DRRRRRRRRRRD",
    "DRRRLRRRRRRD",
    "DRRRRRRLRRRD",
    "DRRLRRRRRRRD",
    "DRRRRRRRLRRD",
    "DRRRRRRRRRRD",
    ".DDRRRRRRDD.",
    "...DDDDDD..."
  ];
  var FLY_DOWN = [
    ".WW......WW.",
    "WWWW....WWWW",
    ".WW.YYYY.WW.",
    "...YYYYYY...",
    "..YDYYYYDY..",
    "..YDYYYYDY..",
    "...YYYYYY...",
    "..KYYYYYYK..",
    "...KK..KK..."
  ];
  var FLY_UP = [
    "..K......K..",
    ".KKK....KKK.",
    "...YYYYYY...",
    "..YDYYYYDY..",
    "..YDYYYYDY..",
    "...YYYYYY...",
    "..KYYYYYYK..",
    "...KK..KK..."
  ];
  var LEAF = [
    ".....DD.....",
    "...DLLGD....",
    "..DLGGGGD...",
    ".DLGGGGGGD..",
    ".DLGGGGGGD..",
    "DLGGDDGGGD..",
    "DLGDGGGGGD..",
    ".DDGGGGGDD..",
    "..DLGGGD....",
    "...DLGD.....",
    "....KD......",
    "....KD......",
    "...KKK......",
    "............"
  ];
  /* ---------- cached world tiles and parallax backdrop ---------- */
  function solidAt(tx,ty) {
    if (!state || ty < 0 || ty >= state.height || tx < 0 || tx >= state.width) return false;
    return "#B?PU".indexOf(state.tiles[ty][tx]) >= 0;
  }
  function pitColumns() {
    var out=[];
    for(var x=0;x<state.width;x++) {
      var gap=true;
      for(var y=Math.max(0,state.height-2);y<state.height;y++) if(solidAt(x,y)){gap=false;break;}
      if(gap) out.push(x);
    }
    return out;
  }
  var cachedPitId="", cachedPits=[];
  function getPitColumns(){var id=state.level+":"+state.width+":"+state.height;if(id!==cachedPitId){cachedPitId=id;cachedPits=pitColumns();}return cachedPits;}
  function floorSurface(col){for(var y=0;y<state.height;y++)if(solidAt(col,y))return y*TILE;return null;}
  function drawTiles() {
    var cam=renderCamX, t0=Math.max(0,Math.floor(cam/TILE)-1), t1=Math.min(state.width-1,Math.ceil((cam+view.width)/TILE));
    var pits=getPitColumns(), pitMap=Object.create(null); pits.forEach(function(x){pitMap[x]=1;});
    for(var ty=0;ty<state.height;ty++) for(var tx=t0;tx<=t1;tx++) {
      var ch=state.tiles[ty][tx]; if(ch==="."&&!pitMap[tx]) continue;
      var dx=PixelCamera.snap(tx*TILE-cam,view.S),dy=ty*TILE;
      if(pitMap[tx] && ty>=state.height-2) continue;
      else PixelTiles.draw(ctx,ch,dx,dy,tx,ty,theme(),clock,solidAt);
    }
    // The empty columns are the pits. Paint the void from the floor line down.
    var pitTop=(state.height-2)*TILE;
    pits.forEach(function(tx){var key="pit:"+theme(),art=pitArt[key];if(!art)pitArt[key]=art=PixelTiles.bakeTile("pit",theme());ctx.drawImage(art,PixelCamera.snap(tx*TILE-cam,view.S),pitTop-4);});
    var id=state.level+":"+state.width+":"+state.height;
    if(plannedFor!==id){plannedProps=PixelProps.plan(state.tiles,theme(),[state.player].concat(state.enemies||[],state.items||[]),state.gemList);plannedFor=id;}
    (plannedProps||[]).forEach(function(prop){var sx=prop.x-cam;if(sx < -32 || sx > view.width+32)return;var key=theme()+":"+prop.kind;if(!propArt[key])propArt[key]=PixelProps.bake(prop.kind,theme());ctx.drawImage(propArt[key],PixelCamera.snap(sx,view.S),prop.floor-24);});
  }
  function drawBackdrop(name,cam) {
    PixelBackdrop.draw(ctx,name,cam,{w:view.width,h:view.height},clock,getPitColumns());
  }
  /* ---------- entities ---------- */
  var PAL_GEM = { C: "#7ef3ff", W: "#ffffff", D: "#0d5f72" };
  var GEM = [
    "....CC....",
    "...CWCD...",
    "..CWCCCD..",
    ".CWCCCCCD.",
    "CWCCCCCCCD",
    "DCCCCCCCCD",
    ".DCCCCCCD.",
    "..DCCCCD..",
    "...DCCD...",
    "....DD...."
  ];
  var gemCache=Object.create(null);
  function gemSprite(cx, cy) {
    var width=Math.max(3,Math.min(10,Math.round(3+Math.abs(Math.sin(clock*3.2))*7)));
    var frame=gemCache[width];
    if(!frame){
      frame=document.createElement("canvas"); frame.width=width; frame.height=GEM.length;
      var fc=frame.getContext("2d");
      for(var r=0;r<GEM.length;r++) for(var c=0;c<GEM[r].length;c++){
        var color=PAL_GEM[GEM[r].charAt(c)]; if(!color) continue;
        var x0=Math.round(c*width/GEM[0].length), x1=Math.round((c+1)*width/GEM[0].length);
        fc.fillStyle=color; fc.fillRect(x0,r,Math.max(1,x1-x0),1);
      }
      gemCache[width]=frame;
    }
    var left=PixelCamera.snap(cx-width/2,view.S), top=PixelCamera.snap(cy-GEM.length/2,view.S);
    ctx.drawImage(frame,left,top);
  }
  function onScreen(x, pad) {
    var cam = renderCamX;
    return x - cam > -pad && x - cam < view.width + pad;
  }
  function drawEntities(skipPlayer) {
    var cam = renderCamX;
    var alpha = hitStop > 0 ? 1 : Math.max(0, Math.min(1, acc / STEP));
    var interp = !previous || alpha === 1 ? state : PixelCamera.blend(previous, PixelCamera.capture(state), alpha);
    var i;
    for (i = 0; i < state.gemList.length; i++) {
      var gm = state.gemList[i];
      if (gm.taken || !onScreen(gm.x, 20)) continue;
      gemSprite(PixelCamera.snap(gm.x - cam, view.S), PixelCamera.snap(gm.y, view.S));
    }
    for (i = 0; i < state.items.length; i++) {
      var it = state.items[i]; var ip = interp.items[i] || it;
      if (!onScreen(ip.x, 20)) continue;
      sproutSprite(PixelCamera.snap(ip.x - cam, view.S), PixelCamera.snap(ip.y, view.S));
    }
    for (i = 0; i < state.enemies.length; i++) {
      var e = state.enemies[i]; var ep = interp.enemies[i] || e;
      if (!e.alive || !onScreen(ep.x, 28)) continue;
      if (e.kind === "buzzer") buzzerSprite(PixelCamera.snap(ep.x - cam, view.S), PixelCamera.snap(ep.y, view.S), e);
      else grumbleSprite(PixelCamera.snap(ep.x - cam, view.S), PixelCamera.snap(ep.y, view.S), e);
    }
    if (skipPlayer) return;
    var p = state.player; var pp = interp.player;
    if (p.invuln > 0 && Math.floor(clock * 12) % 2 === 0) return;
    drawPipSprite(p,pp,cam);
  }
  function grumbleSprite(gx, gy, e) {
    blit(ROCK, gx, gy, PAL_ROCK, e.vx > 0);
  }
  function buzzerSprite(gx, gy, e) {
    var flap = Math.sin((e.t || 0) * Math.PI * 2 / 0.28) > 0;
    blit(flap ? FLY_DOWN : FLY_UP, gx, gy + (flap ? 0 : 5), PAL_FLY, false);
  }
  function sproutSprite(gx, gy) {
    blit(LEAF, gx, gy, PAL_LEAF, false);
  }

  /* ---------- HUD and overlays ---------- */
  var FONT = String.fromCharCode(34) + "Press Start 2P" + String.fromCharCode(34) + ", monospace";
  function text(str, gx, gy, size, color, align) {
    ctx.save();
    ctx.fillStyle = color || "#ffffff";
    ctx.font = size + "px " + FONT;
    ctx.textAlign = align || "left";
    ctx.textBaseline = "top";
    ctx.fillText(str, Math.round(gx), Math.round(gy));
    ctx.restore();
  }
  function hud() {
    var name = (PixelLeap.LEVELS[state.level] || { name: "?" }).name;
    var t = Math.max(0, Math.ceil(state.time));
    var mm = Math.floor(t / 60);
    var ss = ("0" + (t % 60)).slice(-2);
    /* Two rows per side; at the 240 px portrait view width each side stays inside 116 game px. */
    text("SCORE " + state.score, 4, 4, 8, "#ffffff");
    text("GEMS " + state.gems, 4, 16, 8, "#7ef3ff");
    for (var i = 0; i < Math.min(state.lives, 6); i++) {
      blit(LIFE_ICON, 5 + i * 9, 27, { D: "#0f7f7a", W: "#2fd8c8" }, false);
    }
    /* With the touch buttons on screen they sit over the top-right corner, so
       the right-hand block moves left of mute — or below it when too narrow. */
    var rx = view.width - 4;
    var topY = 4;
    var midY = 16;
    if (ctl.touchActive() && layout) {
      var muteLeft = (layout.mute.x * view.dpr - view.offX) / view.S;
      ctx.save();
      ctx.font = "8px " + FONT;
      var need = Math.max(
        ctx.measureText("TIME " + mm + ":" + ss).width,
        ctx.measureText(name.toUpperCase() + " " + (state.level + 1) + "/3").width
      );
      ctx.restore();
      if (muteLeft - 4 - need >= 4) {
        rx = muteLeft - 4;
      } else {
        var below = Math.round(((layout.mute.y + layout.mute.h) * view.dpr - view.offY) / view.S) + 4;
        topY = below;
        midY = below + 12;
      }
    }
    text("TIME " + mm + ":" + ss, rx, midY, 8, t <= 30 ? "#ff8a7a" : "#ffffff", "right");
    text(name.toUpperCase() + " " + (state.level + 1) + "/3", rx, topY, 8, "#ffe66a", "right");
  }
  /* ---------- main loop ---------- */
  var flow = PixelScreens.createFlow();
  var best = PixelScreens.loadBest();
  var last = 0;
  var acc = 0;
  var STEP = 1 / 60;
  var MAX_DT = 1 / 30;
  var events = [];

  function drainEvents() {
    var q = state.events;
    audio.playEvents(q);
    for (var i = 0; i < q.length; i++) {
      events.push(q[i]);
      frameEvents.push(q[i]);
      if (q[i] === "stomp") hitStop = Math.max(hitStop, 0.06);
      else if (q[i] === "hurt") hitStop = Math.max(hitStop, 0.08);
      else if (q[i] === "die") hitStop = Math.max(hitStop, 0.12);
    }
    q.length = 0;
    /* stage 2b reads this queue for sound effects; keep it bounded */
    if (events.length > 64) events.splice(0, events.length - 64);
  }
  function newGame() {
    state = PixelLeap.createGame({ level: debugLevel, lives: 3 });
    if (debugBig) state.player.big = true;
    state.viewWidth = view.width;
    PixelCamera.reset(renderCamera, state.player, { w: view.width }, state.width * PixelLeap.TILE);
    previous = PixelCamera.capture(state);
    hitStop = 0;
    acc = 0;
    events.length = 0;
    drainEvents();
    /* Arm the title-theme loop before the first gesture; update() stays silent
       until the context exists. */
    audio.setMusic(theme());
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#4aa8ff";
    if (view.offY) ctx.fillRect(0,0,view.pxW,view.offY);
    if (view.offX) ctx.fillRect(0,view.offY,view.offX,view.bandPx);
    if (view.offX) ctx.fillRect(view.offX+view.width*view.S,view.offY,view.pxW-view.offX-view.width*view.S,view.bandPx);
    var activeTheme = themeColors();
    if (view.portrait && view.bandPx < view.pxH) {
      var pkey=theme()+":"+view.pxW+":"+view.pxH+":"+view.offY;
      var panel=panelCache[pkey];
      if(!panel){ panel=document.createElement("canvas"); panel.width=view.pxW; panel.height=view.pxH-view.offY-view.bandPx;
        var pc=panel.getContext("2d"), pg=pc.createLinearGradient(0,0,0,panel.height); pg.addColorStop(0,activeTheme.dirt); pg.addColorStop(1,activeTheme.dark); pc.fillStyle=pg; pc.fillRect(0,0,panel.width,panel.height); panelCache[pkey]=panel; }
      ctx.drawImage(panel,0,view.offY+view.bandPx);
      ctx.fillStyle = activeTheme.topHi; ctx.fillRect(0, view.offY+view.bandPx, view.pxW, Math.max(1, view.S));
    }
    ctx.setTransform(view.S, 0, 0, view.S, view.offX, view.offY);
    ctx.imageSmoothingEnabled = false;
    /* Keep world layers inside the play band. */
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, view.width, view.height);
    ctx.clip();
    drawScene();
    ctx.restore();
    /* Thumb buttons live in CSS-px space, above the letterboxed game view. */
    if (ctl.touchActive() && layout) {
      ctx.save();
      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      PixelControls.drawButtons(ctx, layout, ctl.pressed());
      ctx.restore();
    }
  }
  function levelName() {
    return (PixelLeap.LEVELS[state.level] || { name: "?" }).name;
  }
  /* ctl.touchActive() only turns on after the first touch, so the very first
     prompt would say SPACE on a phone; classify the device instead. */
  function touchMode() {
    return (
      ctl.touchActive() ||
      (window.matchMedia && matchMedia("(pointer: coarse)").matches) ||
      navigator.maxTouchPoints > 0
    );
  }
  function drawScene() {
    drawBackdrop(theme(), renderCamX);
    ctx.save();
    ctx.translate(0, view.height - VIEW_H);
    drawTiles();
    PixelBackdrop.drawFront(ctx,theme(),renderCamX,{w:view.width,h:view.height},clock,floorSurface,getPitColumns());
    drawEntities(flow.screen === "title");
    ctx.restore();
    if (flow.screen !== "title") hud();
    /* Screen flow overlays (title / paused / clear / game over / won) in game px. */
    PixelScreens.drawScreen(
      ctx,
      flow.screen,
      {
        score: state ? state.score : 0,
        best: best,
        gems: state ? state.gems : 0,
        lives: state ? state.lives : 0,
        levelName: state ? levelName() : "LEVEL",
        muted: audio.isMuted(),
        touch: touchMode()
      },
      view.width,
      view.height,
      clock
    );
  }

  function frame(ms) {
    var now = ms / 1000;
    if (!last) last = now;
    var elapsed = now - last;
    last = now;
    if (elapsed > 0.25) elapsed = 0.25;
    frameElapsed=Math.min(.05,elapsed);frameEvents.length=0;
    if (document.hidden) {
      flow.pause();
      ctl.reset();
    } else {
      if (ctl.consumeMute()) {
        const m = audio.toggleMute();
        PixelScreens.saveMuted(m);
      }
      var act = { action: ctl.consumeAction(), pause: ctl.consumePause() };
      var result = flow.update(state ? state.mode : "playing", elapsed, act);
      if (result === "restart") {
        if (flow.entered === "playing" || !state) newGame();
        else {
          PixelLeap.restart(state);
          previous = PixelCamera.capture(state);
          PixelCamera.reset(renderCamera, state.player, { w: view.width }, state.width * PixelLeap.TILE);
        }
        drainEvents();
        acc = 0;
        audio.setMusic((PixelLeap.LEVELS[state.level] || { theme: "meadow" }).theme);
      } else if (result === "nextLevel") {
        if (state) {
          PixelLeap.nextLevel(state);
          previous = PixelCamera.capture(state);
          PixelCamera.reset(renderCamera, state.player, { w: view.width }, state.width * PixelLeap.TILE);
          drainEvents();
          acc = 0;
          audio.setMusic((PixelLeap.LEVELS[state.level] || { theme: "meadow" }).theme);
        }
      }
      if (state && (flow.entered === "gameover" || flow.entered === "won")) {
        best = PixelScreens.saveBest(state.score);
        audio.setMusic(null);
      }
      /* Title screen music follows the level shown behind the logo. */
      if (state && flow.entered === "title") {
        audio.setMusic((PixelLeap.LEVELS[state.level] || { theme: "meadow" }).theme);
      }
      clock += elapsed;
      if (result === "step") {
        var playerInput = ctl.input();
        acc += elapsed;
        var guard = 0;
        while (acc >= STEP && guard < 10) {
          if (hitStop > 0) { hitStop = Math.max(0, hitStop - STEP); acc -= STEP; guard++; continue; }
          previous = PixelCamera.capture(state);
          var beforePlayer = { x: state.player.x, y: state.player.y };
          var entityCount = state.enemies.length + state.items.length;
          PixelLeap.step(state, playerInput, Math.min(STEP, MAX_DT));
          pipAnimator.advanceScarf(state.player,playerInput,STEP);
          PixelCamera.update(renderCamera, state.player, { w: view.width }, state.width * PixelLeap.TILE, STEP);
          if (entityCount !== state.enemies.length + state.items.length) previous = PixelCamera.capture(state);
          if (state.events.indexOf("die") !== -1 || Math.abs(state.player.x - beforePlayer.x) > 32 || Math.abs(state.player.y - beforePlayer.y) > 32) {
            previous = PixelCamera.capture(state);
            PixelCamera.reset(renderCamera, state.player, { w: view.width }, state.width * PixelLeap.TILE);
          }
          drainEvents();
          acc -= STEP;
          guard++;
        }
        if (guard >= 10) acc = 0;
      }
    }
    if (state) renderCamX = PixelCamera.snap(renderCamera.x, view.S);
    audio.update();
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 150); });
  document.addEventListener("visibilitychange", function () {
    last = 0;
    acc = 0;
    if (document.hidden) {
      flow.pause();
      ctl.reset();
      audio.suspend();
    } else {
      audio.resume();
    }
  });

  /* Single input path: every key and pointer goes through PixelControls. */
  window.addEventListener("keydown", function (ev) {
    /* iOS only lets an AudioContext start inside a gesture handler. */
    audio.unlock();
    if (ctl.keyDown(ev.code)) ev.preventDefault();
  });
  window.addEventListener("keyup", function (ev) {
    if (ctl.keyUp(ev.code)) ev.preventDefault();
  });
  window.addEventListener("blur", function () {
    flow.pause();
    ctl.reset();
  });

  function canvasPoint(ev) {
    var r = canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  canvas.addEventListener("pointerdown", function (ev) {
    ev.preventDefault();
    audio.unlock();
    var p = canvasPoint(ev);
    ctl.pointerDown(ev.pointerId, p.x, p.y, ev.pointerType);
  }, { passive: false });
  canvas.addEventListener("pointermove", function (ev) {
    ev.preventDefault();
    var p = canvasPoint(ev);
    ctl.pointerMove(ev.pointerId, p.x, p.y);
  }, { passive: false });
  canvas.addEventListener("pointerup", function (ev) {
    ev.preventDefault();
    audio.unlock();
    ctl.pointerUp(ev.pointerId);
  }, { passive: false });
  canvas.addEventListener("pointercancel", function (ev) {
    ev.preventDefault();
    ctl.pointerUp(ev.pointerId);
  }, { passive: false });

  newGame();
  resize();
  requestAnimationFrame(frame);

  /* Read-only handle for headless verification. */
  window.__pixelLeap = Object.freeze({
    get state() { return state ? JSON.parse(JSON.stringify(state)) : null; },
    get screen() { return flow.screen; }
  });
})();
</script>
</body>
</html>
