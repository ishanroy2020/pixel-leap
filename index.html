    -webkit-user-select: none;

    top: 0;

<script>

    "..KYYYYYYK..",

    "...DLLGD....",
    "..DLGGGGD...",
    ".DLGGGGGGD..",
    ".DLGGGGGGD..",
    "DLGGDDGGGD..",
    "DLGDGGGGGD..",
    ".DDGGGGGDD..",
    "..DLGGGD....",
    "...DLGD.....",
    "....KD......",
    "....KD......",
    "...KKK......",
    "............"

  /* ---------- tiles ---------- */

  function drawTileArt(ch, dx, dy, tx, ty) {

      ctx.fillStyle = "#5e2f1a";

      ctx.fillRect(dx, dy + 15, TILE, 1);
      ctx.fillRect(dx + 7, dy + 1, 1, 6);
      ctx.fillRect(dx + 3, dy + 8, 1, 7);
      ctx.fillRect(dx + 11, dy + 8, 1, 7);
    } else if (ch === "?" || ch === "P") {
      ctx.fillStyle = "#c9971a";
      ctx.fillRect(dx, dy, TILE, TILE);
      ctx.fillStyle = "#f5d033";
      ctx.fillRect(dx + 1, dy + 1, 14, 14);
      ctx.fillStyle = "#ffe98a";
      ctx.fillRect(dx + 1, dy + 1, 14, 2);
      ctx.fillStyle = "#8a6300";
      ctx.fillRect(dx + 2, dy + 12, 12, 2);
      ctx.fillStyle = "#7a5200";
      ctx.fillRect(dx + 2, dy + 2, 2, 2);
      ctx.fillRect(dx + 12, dy + 2, 2, 2);
      ctx.fillRect(dx + 2, dy + 10, 2, 2);
      ctx.fillRect(dx + 12, dy + 10, 2, 2);
      if (Math.floor(clock * 6 + tx + ty) % 4 === 0) {
        ctx.fillStyle = "#ffffff";

      }

      ctx.fillStyle = "#7a6534";

      ctx.fillStyle = "#5b4a24";

  var backdropCache=Object.create(null);

            else {ctx.fillStyle="rgba(255,170,90,0.35)";for(var y=0;y<4;y++)ctx.fillRect(ox,view.height*.34+16+y*14,repeat,4);}
          } else if(name==="caverns"){
            if(index===0){ctx.fillStyle="rgba(126,243,255,0.48)";for(var x=ox;x<ox+repeat;x+=90)crystal(x,26+(Math.floor(x/90)%3)*24,12,32);}
            else if(index===1){ctx.fillStyle="rgba(120,140,220,0.22)";for(var x=ox;x<ox+repeat;x+=70)ctx.fillRect(x,base+18,26,6);}
            else {ctx.fillStyle="rgba(60,70,130,0.5)";for(var x=ox;x<ox+repeat;x+=64)ctx.fillRect(x,view.height-2*TILE,30,2*TILE);}
          } else {
            if(index===0){ctx.fillStyle="rgba(255,255,255,0.85)";for(var x=ox;x<ox+repeat;x+=140)cloud(x,24+(Math.floor(x/140)%3)*16);}
            else {var step=index===1?160:120;for(var x=ox-step;x<ox+repeat;x+=step){ctx.fillStyle=index===1?th.hillFar:th.hill;hill(x-(index===1?20:0),base+(index===1?6:22),index===1?96:68,index===1?38:28);}}
          }
        }
        ctx=old; backdropCache[key]=c;
      }
      var drift=index===0?6:0, offset=PixelCamera.snap(-((cam*rate+clock*drift)%repeat),view.S);
      if(name==="caverns"&&index===0)ctx.globalAlpha=0.72+0.2*Math.sin(clock*2);
      ctx.drawImage(c,offset,0); ctx.drawImage(c,offset+repeat,0);
      if(name==="caverns"&&index===0)ctx.globalAlpha=1;
    }
    getLayer(0,0.1); getLayer(1,0.25); getLayer(2,0.45);
  }
  /* ---------- entities ---------- */
  var PAL_GEM = { C: "#7ef3ff", W: "#ffffff", D: "#0d5f72" };
  var GEM = [
    "....CC....",
    "...CWCD...",
    "..CWCCCD..",
    ".CWCCCCCD.",
    "CWCCCCCCCD",
    "DCCCCCCCCD",
    ".DCCCCCCD.",
    "..DCCCCD..",
    "...DCCD...",
    "....DD...."
  ];
  var gemCache=Object.create(null);
  function gemSprite(cx, cy) {
    var width=Math.max(3,Math.min(10,Math.round(3+Math.abs(Math.sin(clock*3.2))*7)));
    var frame=gemCache[width];
    if(!frame){
      frame=document.createElement("canvas"); frame.width=width; frame.height=GEM.length;
      var fc=frame.getContext("2d");
      for(var r=0;r<GEM.length;r++) for(var c=0;c<GEM[r].length;c++){
        var color=PAL_GEM[GEM[r].charAt(c)]; if(!color) continue;
        var x0=Math.round(c*width/GEM[0].length), x1=Math.round((c+1)*width/GEM[0].length);
        fc.fillStyle=color; fc.fillRect(x0,r,Math.max(1,x1-x0),1);
      }
      gemCache[width]=frame;
    }
    var left=PixelCamera.snap(cx-width/2,view.S), top=PixelCamera.snap(cy-GEM.length/2,view.S);
    ctx.drawImage(frame,left,top);
  }
  function onScreen(x, pad) {
    var cam = renderCamX;
    return x - cam > -pad && x - cam < view.width + pad;
  }
  function drawEntities(skipPlayer) {
    var cam = renderCamX;
    var alpha = hitStop > 0 ? 1 : Math.max(0, Math.min(1, acc / STEP));
    var interp = !previous || alpha === 1 ? state : PixelCamera.blend(previous, PixelCamera.capture(state), alpha);
    var i;
    for (i = 0; i < state.gemList.length; i++) {
      var gm = state.gemList[i];
      if (gm.taken || !onScreen(gm.x, 20)) continue;
      gemSprite(PixelCamera.snap(gm.x - cam, view.S), PixelCamera.snap(gm.y, view.S));
    }
    for (i = 0; i < state.items.length; i++) {
      var it = state.items[i]; var ip = interp.items[i] || it;
      if (!onScreen(ip.x, 20)) continue;
      sproutSprite(PixelCamera.snap(ip.x - cam, view.S), PixelCamera.snap(ip.y, view.S));
    }
    for (i = 0; i < state.enemies.length; i++) {
      var e = state.enemies[i]; var ep = interp.enemies[i] || e;
      if (!e.alive || !onScreen(ep.x, 28)) continue;
      if (e.kind === "buzzer") buzzerSprite(PixelCamera.snap(ep.x - cam, view.S), PixelCamera.snap(ep.y, view.S), e);
      else grumbleSprite(PixelCamera.snap(ep.x - cam, view.S), PixelCamera.snap(ep.y, view.S), e);
    }
    if (skipPlayer) return;
    var p = state.player; var pp = interp.player;
    if (p.invuln > 0 && Math.floor(clock * 12) % 2 === 0) return;
    drawPipSprite(p,pp,cam);
  }
  function grumbleSprite(gx, gy, e) {
    blit(ROCK, gx, gy, PAL_ROCK, e.vx > 0);
  }
  function buzzerSprite(gx, gy, e) {
    var flap = Math.sin((e.t || 0) * Math.PI * 2 / 0.28) > 0;
    blit(flap ? FLY_DOWN : FLY_UP, gx, gy + (flap ? 0 : 5), PAL_FLY, false);
  }
  function sproutSprite(gx, gy) {
    blit(LEAF, gx, gy, PAL_LEAF, false);
  }

  /* ---------- HUD and overlays ---------- */
  var FONT = String.fromCharCode(34) + "Press Start 2P" + String.fromCharCode(34) + ", monospace";
  function text(str, gx, gy, size, color, align) {
    ctx.save();
    ctx.fillStyle = color || "#ffffff";
    ctx.font = size + "px " + FONT;
    ctx.textAlign = align || "left";
    ctx.textBaseline = "top";
    ctx.fillText(str, Math.round(gx), Math.round(gy));
    ctx.restore();
  }
  function hud() {
    var name = (PixelLeap.LEVELS[state.level] || { name: "?" }).name;
    var t = Math.max(0, Math.ceil(state.time));
    var mm = Math.floor(t / 60);
    var ss = ("0" + (t % 60)).slice(-2);
    /* Two rows per side; at the 240 px portrait view width each side stays inside 116 game px. */
    text("SCORE " + state.score, 4, 4, 8, "#ffffff");
    text("GEMS " + state.gems, 4, 16, 8, "#7ef3ff");
    for (var i = 0; i < Math.min(state.lives, 6); i++) {
      blit(LIFE_ICON, 5 + i * 9, 27, { D: "#0f7f7a", W: "#2fd8c8" }, false);
    }
    /* With the touch buttons on screen they sit over the top-right corner, so
       the right-hand block moves left of mute — or below it when too narrow. */
    var rx = view.width - 4;
    var topY = 4;
    var midY = 16;
    if (ctl.touchActive() && layout) {
      var muteLeft = (layout.mute.x * view.dpr - view.offX) / view.S;
      ctx.save();
      ctx.font = "8px " + FONT;
      var need = Math.max(
        ctx.measureText("TIME " + mm + ":" + ss).width,
        ctx.measureText(name.toUpperCase() + " " + (state.level + 1) + "/3").width
      );
      ctx.restore();
      if (muteLeft - 4 - need >= 4) {
        rx = muteLeft - 4;
      } else {
        var below = Math.round(((layout.mute.y + layout.mute.h) * view.dpr - view.offY) / view.S) + 4;
        topY = below;
        midY = below + 12;
      }
    }
    text("TIME " + mm + ":" + ss, rx, midY, 8, t <= 30 ? "#ff8a7a" : "#ffffff", "right");
    text(name.toUpperCase() + " " + (state.level + 1) + "/3", rx, topY, 8, "#ffe66a", "right");
  }
  /* ---------- main loop ---------- */
  var flow = PixelScreens.createFlow();
  var best = PixelScreens.loadBest();
  var last = 0;
  var acc = 0;
  var STEP = 1 / 60;
  var MAX_DT = 1 / 30;
  var events = [];

  function drainEvents() {
    var q = state.events;
    audio.playEvents(q);
    for (var i = 0; i < q.length; i++) {
      events.push(q[i]);
      frameEvents.push(q[i]);
      if (q[i] === "stomp") hitStop = Math.max(hitStop, 0.06);
      else if (q[i] === "hurt") hitStop = Math.max(hitStop, 0.08);
      else if (q[i] === "die") hitStop = Math.max(hitStop, 0.12);
    }
    q.length = 0;
    /* stage 2b reads this queue for sound effects; keep it bounded */
    if (events.length > 64) events.splice(0, events.length - 64);
  }
  function newGame() {
    state = PixelLeap.createGame({ level: debugLevel, lives: 3 });
    if (debugBig) state.player.big = true;
    state.viewWidth = view.width;
    PixelCamera.reset(renderCamera, state.player, { w: view.width }, state.width * PixelLeap.TILE);
    previous = PixelCamera.capture(state);
    hitStop = 0;
    acc = 0;
    events.length = 0;
    drainEvents();
    /* Arm the title-theme loop before the first gesture; update() stays silent
       until the context exists. */
    audio.setMusic(theme());
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#4aa8ff";
    if (view.offY) ctx.fillRect(0,0,view.pxW,view.offY);
    if (view.offX) ctx.fillRect(0,view.offY,view.offX,view.bandPx);
    if (view.offX) ctx.fillRect(view.offX+view.width*view.S,view.offY,view.pxW-view.offX-view.width*view.S,view.bandPx);
    var activeTheme = THEME[theme()] || THEME.meadow;
    if (view.portrait && view.bandPx < view.pxH) {
      var pkey=theme()+":"+view.pxW+":"+view.pxH+":"+view.offY;
      var panel=panelCache[pkey];
      if(!panel){ panel=document.createElement("canvas"); panel.width=view.pxW; panel.height=view.pxH-view.offY-view.bandPx;
        var pc=panel.getContext("2d"), pg=pc.createLinearGradient(0,0,0,panel.height); pg.addColorStop(0,activeTheme.dirt); pg.addColorStop(1,activeTheme.dark); pc.fillStyle=pg; pc.fillRect(0,0,panel.width,panel.height); panelCache[pkey]=panel; }
      ctx.drawImage(panel,0,view.offY+view.bandPx);
      ctx.fillStyle = activeTheme.topHi; ctx.fillRect(0, view.offY+view.bandPx, view.pxW, Math.max(1, view.S));
    }
    ctx.setTransform(view.S, 0, 0, view.S, view.offX, view.offY);
    ctx.imageSmoothingEnabled = false;
    /* Keep world layers inside the play band. */
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, view.width, view.height);
    ctx.clip();
    drawScene();
    ctx.restore();
    /* Thumb buttons live in CSS-px space, above the letterboxed game view. */
    if (ctl.touchActive() && layout) {
      ctx.save();
      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      PixelControls.drawButtons(ctx, layout, ctl.pressed());
      ctx.restore();
    }
  }
  function levelName() {
    return (PixelLeap.LEVELS[state.level] || { name: "?" }).name;
  }
  /* ctl.touchActive() only turns on after the first touch, so the very first
     prompt would say SPACE on a phone; classify the device instead. */
  function touchMode() {
    return (
      ctl.touchActive() ||
      (window.matchMedia && matchMedia("(pointer: coarse)").matches) ||
      navigator.maxTouchPoints > 0
    );
  }
  function drawScene() {
    drawBackdrop(theme(), renderCamX);
    ctx.save();
    ctx.translate(0, view.height - VIEW_H);
    drawTiles();
    drawEntities(flow.screen === "title");
    ctx.restore();
    if (flow.screen !== "title") hud();
    /* Screen flow overlays (title / paused / clear / game over / won) in game px. */
    PixelScreens.drawScreen(
      ctx,
      flow.screen,
      {
        score: state ? state.score : 0,
        best: best,
        gems: state ? state.gems : 0,
        lives: state ? state.lives : 0,
        levelName: state ? levelName() : "LEVEL",
        muted: audio.isMuted(),
        touch: touchMode()
      },
      view.width,
      view.height,
      clock
    );
  }

  function frame(ms) {
    var now = ms / 1000;
    if (!last) last = now;
    var elapsed = now - last;
    last = now;
    if (elapsed > 0.25) elapsed = 0.25;
    frameElapsed=Math.min(.05,elapsed);frameEvents.length=0;
    if (document.hidden) {
      flow.pause();
      ctl.reset();
    } else {
      if (ctl.consumeMute()) {
        const m = audio.toggleMute();
        PixelScreens.saveMuted(m);
      }
      var act = { action: ctl.consumeAction(), pause: ctl.consumePause() };
      var result = flow.update(state ? state.mode : "playing", elapsed, act);
      if (result === "restart") {
        if (flow.entered === "playing" || !state) newGame();
        else {
          PixelLeap.restart(state);
          previous = PixelCamera.capture(state);
          PixelCamera.reset(renderCamera, state.player, { w: view.width }, state.width * PixelLeap.TILE);
        }
        drainEvents();
        acc = 0;
        audio.setMusic((PixelLeap.LEVELS[state.level] || { theme: "meadow" }).theme);
      } else if (result === "nextLevel") {
        if (state) {
          PixelLeap.nextLevel(state);
          previous = PixelCamera.capture(state);
          PixelCamera.reset(renderCamera, state.player, { w: view.width }, state.width * PixelLeap.TILE);
          drainEvents();
          acc = 0;
          audio.setMusic((PixelLeap.LEVELS[state.level] || { theme: "meadow" }).theme);
        }
      }
      if (state && (flow.entered === "gameover" || flow.entered === "won")) {
        best = PixelScreens.saveBest(state.score);
        audio.setMusic(null);
      }
      /* Title screen music follows the level shown behind the logo. */
      if (state && flow.entered === "title") {
        audio.setMusic((PixelLeap.LEVELS[state.level] || { theme: "meadow" }).theme);
      }
      clock += elapsed;
      if (result === "step") {
        var playerInput = ctl.input();
        acc += elapsed;
        var guard = 0;
        while (acc >= STEP && guard < 10) {
          if (hitStop > 0) { hitStop = Math.max(0, hitStop - STEP); acc -= STEP; guard++; continue; }
          previous = PixelCamera.capture(state);
          var beforePlayer = { x: state.player.x, y: state.player.y };
          var entityCount = state.enemies.length + state.items.length;
          PixelLeap.step(state, playerInput, Math.min(STEP, MAX_DT));
          pipAnimator.advanceScarf(state.player,playerInput,STEP);
          PixelCamera.update(renderCamera, state.player, { w: view.width }, state.width * PixelLeap.TILE, STEP);
          if (entityCount !== state.enemies.length + state.items.length) previous = PixelCamera.capture(state);
          if (state.events.indexOf("die") !== -1 || Math.abs(state.player.x - beforePlayer.x) > 32 || Math.abs(state.player.y - beforePlayer.y) > 32) {
            previous = PixelCamera.capture(state);
            PixelCamera.reset(renderCamera, state.player, { w: view.width }, state.width * PixelLeap.TILE);
          }
          drainEvents();
          acc -= STEP;
          guard++;
        }
        if (guard >= 10) acc = 0;
      }
    }
    if (state) renderCamX = PixelCamera.snap(renderCamera.x, view.S);
    audio.update();
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 150); });
  document.addEventListener("visibilitychange", function () {
    last = 0;
    acc = 0;
    if (document.hidden) {
      flow.pause();
      ctl.reset();
      audio.suspend();
    } else {
      audio.resume();
    }
  });

  /* Single input path: every key and pointer goes through PixelControls. */
  window.addEventListener("keydown", function (ev) {
    /* iOS only lets an AudioContext start inside a gesture handler. */
    audio.unlock();
    if (ctl.keyDown(ev.code)) ev.preventDefault();
  });
  window.addEventListener("keyup", function (ev) {
    if (ctl.keyUp(ev.code)) ev.preventDefault();
  });
  window.addEventListener("blur", function () {
    flow.pause();
    ctl.reset();
  });

  function canvasPoint(ev) {
    var r = canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  canvas.addEventListener("pointerdown", function (ev) {
    ev.preventDefault();
    audio.unlock();
    var p = canvasPoint(ev);
    ctl.pointerDown(ev.pointerId, p.x, p.y, ev.pointerType);
  }, { passive: false });
  canvas.addEventListener("pointermove", function (ev) {
    ev.preventDefault();
    var p = canvasPoint(ev);
    ctl.pointerMove(ev.pointerId, p.x, p.y);
  }, { passive: false });
  canvas.addEventListener("pointerup", function (ev) {
    ev.preventDefault();
    audio.unlock();
    ctl.pointerUp(ev.pointerId);
  }, { passive: false });
  canvas.addEventListener("pointercancel", function (ev) {
    ev.preventDefault();
    ctl.pointerUp(ev.pointerId);
  }, { passive: false });

  newGame();
  resize();
  requestAnimationFrame(frame);

  /* Read-only handle for headless verification. */
  window.__pixelLeap = Object.freeze({
    get state() { return state ? JSON.parse(JSON.stringify(state)) : null; },
    get screen() { return flow.screen; }
  });
})();
</script>
</body>
</html>
